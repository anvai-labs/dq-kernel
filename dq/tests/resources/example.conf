# Example configuration for Data Quality Framework tests
dqframework {
  dataframes {
    default = "test_table"
  }

  dqrules = [
    {
      name = "basic_completeness"
      engine = "deequ"
      dataframes = ["default"]
      checks = [
        {
          constraint_name = "name_complete"
          constraint = "isComplete"
          column = "name"
          level = "Error"
        }
        {
          constraint_name = "age_non_negative"
          constraint = "isNonNegative"
          column = "age"
          level = "Warning"
        }
      ]
    }
  ]
}
