[tool.poetry]
name = "dq-kernel"
version = "0.3.0"
description = "A flexible data quality framework with engine extensibility using Python reflection"
authors = ["Data Quality Framework Contributors"]
license = "Apache-2.0"
readme = "README.md"
homepage = "https://github.com/anvai-labs/dq-kernel"
repository = "https://github.com/anvai-labs/dq-kernel"
documentation = "https://github.com/anvai-labs/dq-kernel#documentation"
keywords = ["data-quality", "spark", "deequ", "great-expectations", "data-validation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Database",
    "Topic :: Scientific/Engineering",
]
packages = [{include = "dq"}]

# Poetry performance configuration (applied via CLI/env vars)

[tool.poetry.dependencies]
python = ">=3.12,<3.14"

# ULTRA-LIGHT CORE DEPENDENCIES ONLY
# Essential for framework functionality
pyhocon = "^0.3.59"              # Configuration parsing (HOCON format)
pyyaml = "^6.0"                  # YAML configuration support
requests = "^2.33.0"             # HTTP requests (for remote config)
pyasn1 = ">=0.6.5"                  # security: quadratic-complexity DoS fix
msgpack = ">=1.2.3"                 # security: unbounded memory leak fix
filelock = ">=4.2.1"                # security: SQLite lock DB reopen fix

# Windows compatibility (lightweight)
pywin32-ctypes = {version = "^0.2.0", markers = "sys_platform == 'win32'"}

# Optional heavy dependencies (install with poetry install -E <extra>)
pyspark = {version = "3.5.9", optional = true}
pydeequ = {version = "1.7.0", optional = true}
boto3 = {version = "^1.26.0", optional = true}
cron-schedule-triggers = {version = "^0.0.11", optional = true}
databricks-sdk = {version = ">=0.123,<0.171", optional = true}
great_expectations = {version = ">=1.24,<2", optional = true}
delta-spark = {version = ">=3.3,<3.4", optional = true}
# DQX 0.17.x requires Python <3.13 (hence the python marker). Its
# databricks-sdk requirement (>=0.73,<1) overlaps the databricks extra, so
# the two extras are co-installable; Poetry skips this extra on Python 3.13.
databricks-labs-dqx = {version = ">=0.17.2,<0.18", optional = true, python = ">=3.12,<3.13"}
# The durable SQL sink and its Arrow batch path (SPEC-007). SQLAlchemy's range
# overlaps the dqx extra's (<2.1), so an installation with every extra
# resolves a 2.0 release and one with only this extra a 2.1 release.
sqlalchemy = {version = ">=2.0,<2.2", optional = true}
pyarrow = {version = ">=16,<27", optional = true}
# The OpenTelemetry observer (SPEC-014). The API only: an application brings
# its own SDK, exporter and providers, as OpenTelemetry instrumentation is
# meant to compose.
opentelemetry-api = {version = ">=1.25,<2", optional = true}

[tool.poetry.extras]
spark = ["pyspark"]
deequ = ["pydeequ"]
aws = ["boto3"]
cron = ["cron-schedule-triggers"]
databricks = ["databricks-sdk", "cron-schedule-triggers"]
greatexpectations = ["great_expectations"]
delta = ["delta-spark", "pyspark"]
dqx = ["databricks-labs-dqx"]
sqlalchemy = ["sqlalchemy"]
arrow = ["pyarrow"]
otel = ["opentelemetry-api"]

# Minimal development dependencies (only for CI)
[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
pytest-cov = ">=6,<8"           # Branch coverage gate
black = "26.10.1"                  # Formatting (lint runs on 3.13)
flake8 = ">=6,<8"               # Linting only
bandit = "^1.7.5"               # Security scanning only
pip-audit = "^2.10.1"             # Audit lane runs on 3.13
diff-cover = "11.0.4"
hypothesis = ">=6.100,<7"      # Property-based tests for the pure kernel
# The OpenTelemetry observer is also tested through the real API, with the
# SDK's in-memory providers: nothing is exported off the process.
opentelemetry-sdk = ">=1.25,<2"
# Two libraries whose frames the Arrow adapter must accept through Arrow
# interchange (SPEC-015). Development dependencies only: the package never
# imports them. They are installed so that those tests run in CI instead of
# skipping. The ranges are anchored on the versions the tests were run on.
polars = "^2.0"
datafusion = "^55.0"

[tool.poetry.scripts]
dq-kernel = "dq.cli:main"
dq-validate = "dq.validate:main"
dq-engines = "dq.engines:main"
dq-import = "dq.harvest.cli:main"
dq-run = "dq.runner:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# Optimized tool configurations for CI performance
[tool.black]
line-length = 88
target-version = ['py312', 'py313']
fast = true                     # Fast mode for CI
quiet = false                   # Name offending files on CI failures

[tool.pytest.ini_options]
minversion = "7.0"
faulthandler_timeout = 60
testpaths = ["dq/tests"]
# Never add --no-summary here: pytest >= 9 skips the whole terminal summary
# under that flag, which hides every failure traceback (CI included).
addopts = "--tb=short --no-header -ra"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "spark: Spark integration tests",
    "slow: Slow running tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.flake8]
max-line-length = 88
extend-ignore = "E203,W503"
jobs = 4                        # Parallel processing
statistics = false              # Reduce output
count = true                    # Count errors only

[tool.bandit]
exclude_dirs = ["tests", "build", "dist", ".venv"]
skips = ["B101"]                # Skip assert_used test
quiet = true                    # Reduce output

[tool.coverage.run]
source = ["dq"]
omit = [
    "*/tests/*",
    "*/test_*",
    "build/*",
    "dist/*",
    ".venv/*",
]
parallel = true                 # Parallel coverage collection

[tool.coverage.report]
fail_under = 90                 # A ratchet, a few points under what CI measures
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = false            # Reduce output
skip_empty = true               # Skip empty files
