name: CI

on:
  push:
    branches: [main]
  # No branch filter on purpose: pull requests are tested whatever their
  # base branch, so stacked pull requests get the same gates as ones to main.
  pull_request:

permissions:
  contents: read

concurrency:
  group: public-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    if: >-
      github.event_name != 'pull_request' ||
      vars.OWNER_PRIVATE_CI_ENABLED != 'true' ||
      github.actor_id != '5168752' ||
      github.event.pull_request.user.id != 5168752 ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install Poetry
        run: pip install poetry==2.5.2
      - name: Check lock file matches pyproject
        run: poetry check --lock
      - name: Install dependencies
        run: poetry install --with dev
      - name: Check formatting
        run: poetry run black --check dq/
      # Not "without optional engine dependencies": the development group
      # carries three extras' packages. The proof that the wheel needs no
      # extra is in the build job.
      - name: Validate example in a development install
        run: poetry run dq-validate examples/basic_deequ_validation.conf
      - name: Lint
        run: >-
          poetry run flake8 dq/ --exclude=dq/notebooks
          --select E9,F63,F7,F82
      - name: Security scan
        run: poetry run bandit -r dq/ -x tests -s B101 -lll -q
      - name: Dependency audit
        run: poetry run pip-audit --skip-editable
      - name: Validate workflow syntax
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location --retry 3 --max-time 60 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o actionlint.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz' | sha256sum --check --status
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint "$GITHUB_WORKSPACE"/.github/workflows/*.yml

  test:
    timeout-minutes: 15
    if: >-
      github.event_name != 'pull_request' ||
      vars.OWNER_PRIVATE_CI_ENABLED != 'true' ||
      github.actor_id != '5168752' ||
      github.event.pull_request.user.id != 5168752 ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python-version: "3.12"
            coverage_min: "90"
          - python-version: "3.13"
            coverage_min: "90"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Poetry
        run: pip install poetry==2.5.2
      # Every extra with tests installs here: the lock resolves one version per
      # package for the union of extras, so they are co-installable. The dqx
      # extra carries a Python <3.13 marker; Poetry skips it on the 3.13 job
      # and its live tests skip with it.
      - name: Install dependencies
        run: >-
          poetry install --with dev
          -E spark -E deequ -E aws -E databricks -E greatexpectations -E dqx
          -E sqlalchemy -E arrow -E otel -E pandera
      - name: Download Deequ JAR
        run: |
          mkdir -p lib
          wget -q -O lib/deequ-2.0.21-spark-3.5.jar \
            https://repo1.maven.org/maven2/com/amazon/deequ/deequ/2.0.21-spark-3.5/deequ-2.0.21-spark-3.5.jar
          wget -q -O lib/dqdl-1.0.0.jar \
            https://repo1.maven.org/maven2/software/amazon/glue/dqdl/1.0.0/dqdl-1.0.0.jar
      - name: Run tests
        timeout-minutes: 10
        run: >-
          poetry run pytest dq/tests/ -v --tb=short
          --cov=dq --cov-branch --cov-report=term-missing
          --cov-report=xml --cov-report=json:coverage.json
          --cov-fail-under=${{ matrix.coverage_min }}
        env:
          SPARK_VERSION: "3.5"
      - name: Enforce independent line and branch floors
        if: matrix.python-version == '3.13'
        run: >-
          poetry run python scripts/check_coverage.py coverage.json
          --min-line 90 --min-branch 88
      - name: Enforce changed-code coverage
        if: matrix.python-version == '3.13' && github.event_name == 'pull_request'
        run: poetry run diff-cover coverage.xml --compare-branch=origin/${{ github.base_ref }} --fail-under=90

  dependency-review:
    name: Dependency review
    if: >-
      github.event_name == 'pull_request' &&
      (vars.OWNER_PRIVATE_CI_ENABLED != 'true' ||
      github.actor_id != '5168752' ||
      github.event.pull_request.user.id != 5168752 ||
      github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The same download and the same check as the owner lane makes.
      - name: Check documentation links
        # This check went red three times in one day on a link no pull request
        # had touched, and two things were measured about it. lychee does not
        # retry a status code; and GitHub's file pages answer 503 to everybody
        # for half an hour at a time, while the same file at its raw address
        # answers steadily -- 404 included, when the file is not there.
        # scripts/check_links.py runs the check again while only such
        # failures remain (a broken link still fails at once), and --remap
        # has a GitHub file page asked for as the file itself.
        env:
          LYCHEE_ARCHIVE_SHA256: 73657a111819a30c47c08352896796f23d64e4eb2b3ed39b6d32149241566fc5
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/lychee-x86_64-unknown-linux-musl.tar.gz"
          install_dir="${RUNNER_TEMP}/lychee-v0.24.2"
          curl --fail --location --retry 3 --output "${archive}" \
            https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-musl.tar.gz
          printf '%s  %s\n' "${LYCHEE_ARCHIVE_SHA256}" "${archive}" | sha256sum --check --strict
          rm -rf "${install_dir}"
          mkdir -p "${install_dir}"
          tar -xzf "${archive}" --strip-components=1 -C "${install_dir}"
          # The $1, $2 and $3 below are lychee's, not the shell's.
          # shellcheck disable=SC2016
          python3 scripts/check_links.py --attempts 4 --wait 30 -- "${install_dir}/lychee" \
            --no-progress --root-dir . --max-retries 3 --timeout 30 \
            --exclude '^file:///(absolute/path|path/to)/' './**/*.md' './**/*.adoc' \
            --remap 'https://github\.com/([^/]+)/([^/]+)/blob/(.+) https://raw.githubusercontent.com/$1/$2/$3'
      - name: Review dependency changes
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: moderate

  build:
    name: build
    if: >-
      always() &&
      (github.event_name != 'pull_request' ||
      vars.OWNER_PRIVATE_CI_ENABLED != 'true' ||
      github.actor_id != '5168752' ||
      github.event.pull_request.user.id != 5168752 ||
      github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-latest
    needs: [lint, test, dependency-review]
    steps:
      # The gate is generic on purpose: every lane listed in `needs` must
      # succeed, so adding a lane cannot produce a red job that merges anyway.
      - name: Verify required jobs
        env:
          EVENT_NAME: ${{ github.event_name }}
          NEEDS: ${{ toJSON(needs) }}
        # Plain Python rather than jq: dq/tests/test_ci_workflow_contract.py
        # executes this exact script against sample `needs` maps, so the gate
        # logic is tested instead of eyeballed.
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS"])
          failed = False
          for name, lane in sorted(needs.items()):
              result = lane.get("result")
              print(f"{name}: {result}")
              if result not in ("success", "skipped"):
                  failed = True
          # On pull requests the dependency review must actually have run.
          review = needs.get("dependency-review", {}).get("result")
          if os.environ["EVENT_NAME"] == "pull_request" and review != "success":
              print("dependency-review must run and succeed on pull requests")
              failed = True
          sys.exit(1 if failed else 0)
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install Poetry
        run: pip install poetry==2.5.2
      - name: Build package
        run: poetry build
      - name: Verify the published rule-pack schema ships in the wheel
        run: |
          python - <<'PY'
          import glob
          import zipfile

          wheel = sorted(glob.glob("dist/dq_kernel-*.whl"))[-1]
          required = "dq/schemas/rule-pack.schema.json"
          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()
          assert required in names, f"{required} is missing from {wheel}"
          print(f"{wheel} carries {required}")
          PY
      - name: Prove the wheel needs no extra
        # The dev group carries three extras' packages (datafusion brings
        # pyarrow, duckdb-engine brings SQLAlchemy, the OpenTelemetry SDK brings
        # the OpenTelemetry API), and every lane has Spark, so no lane that
        # installs it can show the package manages without them. Only a bare
        # install of the wheel can; the script says what it checks there.
        run: |
          python -m venv "$RUNNER_TEMP/core"
          "$RUNNER_TEMP/core/bin/python" -m pip install --quiet --disable-pip-version-check dist/dq_kernel-*.whl
          "$RUNNER_TEMP/core/bin/python" scripts/check_core_install.py dist/dq_kernel-*.whl
      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
