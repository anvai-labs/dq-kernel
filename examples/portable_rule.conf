# Portable kernel plan executed through the engine plugin path (ADR-010)
dqframework {
  dataset = "orders_snapshot"
  dqrules = [
    {
      name = "portable_counts"
      engine = "portable"
      dataframes = ["default"]
      # Caller-certified snapshot digest: plans fingerprint data by
      # SHA-256 and the digest is never auto-derived.
      dataset = "orders"
      snapshot_sha256 = "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
      # Legacy constraint subset the fail-closed translator accepts;
      # anything else is rejected, never translated (ADR-002).
      plan = [
        { constraint = "isComplete", constraint_name = "order_id_complete", column = "order_id", level = "Error" }
        { constraint = "hasSize", constraint_name = "orders_present", assertion = "lambda size: size >= 1", level = "Warning" }
      ]
    }
  ]
}
