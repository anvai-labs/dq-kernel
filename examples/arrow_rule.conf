# A rule pack for the Spark-free runner (SPEC-015). With a Parquet file:
#
#   dq-run arrow_rule.conf --dataset orders=orders.parquet --report report.json
#
# Each rule is one plan, and a plan holds one semantic version, so the three
# versions are three rules. Every rule names the Arrow adapter: a run over
# files executes portable rules on Arrow and does not substitute an adapter.
dqframework {
  dataset = "orders_snapshot"

  dqrules = [
    {
      name = "orders_counts"
      engine = "portable"
      dataframes = ["orders"]
      # Caller-certified snapshot digest: never worked out from the files.
      dataset = "orders"
      snapshot_sha256 = "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
      adapter = "arrow"
      plan = [
        { constraint = "isComplete", constraint_name = "order_id_complete", column = "id", level = "Error" }
        { constraint = "hasSize", constraint_name = "orders_present", assertion = "lambda size: size >= 1", level = "Warning" }
      ]
    }
    {
      name = "orders_groups"
      engine = "portable"
      dataframes = ["orders"]
      dataset = "orders"
      snapshot_sha256 = "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
      adapter = "arrow"
      plan = [
        { constraint = "DistinctnessByGroup", constraint_name = "orders_per_customer", columns = ["id"], group_by = ["customer_id"], min = 1, level = "Error" }
      ]
    }
    {
      name = "orders_ranges"
      engine = "portable"
      dataframes = ["orders"]
      dataset = "orders"
      snapshot_sha256 = "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
      adapter = "arrow"
      plan = [
        { constraint = "isInRange", constraint_name = "amount_range", column = "amount", min = -100.00, max = 100.00, level = "Warning" }
      ]
    }
  ]
}
