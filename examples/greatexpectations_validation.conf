# Great Expectations (GX Core) validation example
dqframework {
  dqrules = [
    {
      name = "gx_basic_checks"
      engine = "greatexpectations"
      dataframes = ["default"]
      expectations = [
        { type = "expect_column_values_to_not_be_null", column = "id" }
        { type = "expect_column_values_to_be_unique", column = "id" }
        { type = "expect_column_values_to_match_regex", column = "email", regex = ".+@.+" }
        # Table-level expectations omit `column` entirely.
        { type = "expect_table_row_count_to_be_between", min_value = 1, max_value = 1000000 }
      ]
    }
  ]
}
