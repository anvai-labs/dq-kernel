# Databricks Labs DQX (databricks-labs-dqx) validation example
dqframework {
  dqrules = [
    {
      name = "dqx_basic_checks"
      engine = "dqx"
      dataframes = ["default"]
      # Entries pass through to DQX metadata checks (see
      # https://databrickslabs.github.io/dqx/). `criticality` defaults to
      # "error"; missing names get deterministic "<function>_<index>" names;
      # for_each_column expands in DQX and reports one aggregated result.
      checks = [
        { check = { function = "is_not_null", arguments = { column = "id" } } }
        { name = "emails_match", criticality = "warn"
          check = { function = "regex_match", arguments = { column = "email", regex = ".+@.+" } } }
        { name = "ids_unique"
          check = { function = "is_unique", arguments = { columns = ["id"] } } }
        { name = "non_empty_strings", criticality = "warn"
          check = { function = "is_not_null_and_not_empty", for_each_column = ["email", "name"] } }
      ]
      # client.mode = "stub" (default) runs without a Databricks workspace.
      # client.mode = "workspace" builds a real WorkspaceClient (optionally
      # client.profile = "staging") for workspace-backed features.
    }
  ]
}
