# Databricks Unity Catalog configuration example
# Requires Spark session configured with Unity Catalog (Databricks Runtime 11.3+)
dqframework {
  catalog_type = "unity"

  dataframes {
    # Three-part naming: catalog.schema.table
    orders = "main.sales.orders"
    customers = "main.sales.customers"
  }

  dqrules = [
    {
      name = "orders_validation"
      engine = "deequ"
      dataframes = ["orders"]
      checks = [
        { constraint_name = "order_id_complete", constraint = "isComplete", column = "order_id", level = "Error" }
        { constraint_name = "amount_non_negative", constraint = "isNonNegative", column = "amount", level = "Error" }
      ]
    }
    {
      name = "orders_schema_validation"
      engine = "schemavalidation"
      dataframes = ["orders"]
      schema {
        catalog_type = "unity"
        catalog = "main"
        database = "sales"
        table = "orders"
        not_null_columns = ["order_id", "customer_id"]
        unique_constraints = [["order_id"]]
        foreign_key_constraints = [
          {
            src_column = "customer_id"
            ref_db = "main.sales"
            ref_table = "customers"
            ref_column = "customer_id"
          }
        ]
      }
    }
  ]
}
