# AWS Glue Data Catalog configuration example
# Requires Spark configured with Glue as Hive metastore, or boto3 for direct API access
dqframework {
  catalog_type = "glue"

  dataframes {
    # Glue uses database.table naming
    orders = "sales_db.orders"
    inventory = "warehouse_db.inventory"
  }

  dqrules = [
    {
      name = "orders_completeness"
      engine = "deequ"
      dataframes = ["orders"]
      checks = [
        { constraint_name = "order_id_complete", constraint = "isComplete", column = "order_id", level = "Error" }
        { constraint_name = "customer_id_complete", constraint = "isComplete", column = "customer_id", level = "Error" }
        { constraint_name = "amount_non_negative", constraint = "isNonNegative", column = "order_amount", level = "Warning" }
      ]
    }
    {
      name = "inventory_schema"
      engine = "schemavalidation"
      dataframes = ["inventory"]
      schema {
        catalog_type = "glue"
        database = "warehouse_db"
        table = "inventory"
        not_null_columns = ["sku", "warehouse_id", "quantity"]
        unique_constraints = [["sku", "warehouse_id"]]
      }
    }
  ]
}
