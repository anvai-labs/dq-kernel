# Observing a run (SPEC-014). A run tells an observer when it starts, when each
# rule starts and finishes against each dataset, when it finishes, and what the
# gate decided. Observers are configured like notifiers.
#
# With nothing configured the run is logged under the "dq.run_events" logger,
# one line per notification. Run with DQ_LOG_FORMAT=json for JSON lines.
dqframework {
  dataset = "orders"

  # A configured list replaces that default, as it does for notifiers, so
  # `logging` is listed here to keep it. `memory` keeps every notification in
  # order, for a platform that wants the events themselves.
  observers = [
    { type = "logging" }
    # `otel` opens one span per run and per rule, and counts outcomes by
    # status and criticality. It needs the extra
    # (pip install dq-kernel[otel]) and an OpenTelemetry SDK whose providers
    # the application configures; until then it records nothing.
    # { type = "otel" }
  ]

  dqrules = [
    {
      name = "orders_quality"
      engine = "deequ"
      dataframes = ["default"]
      checks = [
        { constraint_name = "order_id_complete", constraint = "isComplete", column = "order_id" }
      ]
    }
  ]
}
