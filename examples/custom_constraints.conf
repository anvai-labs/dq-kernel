# Custom engine constraints example
dqframework {
  dqrules = [
    {
      name = "stale_value_detection"
      engine = "custom"
      dataframes = ["default"]
      checks = [
        {
          constraint_name = "distinctness_check"
          constraint = "DistinctnessByGroup"
          columns = ["value_col1", "value_col2"]
          group_by = ["category", "region"]
          min = 2
          level = "Error"
        }
      ]
    }
    {
      name = "rate_of_change_detection"
      engine = "custom"
      dataframes = ["default"]
      checks = [
        {
          constraint_name = "rate_change_check"
          constraint = "RateOfChange"
          columns = ["price", "volume"]
          group_by = ["ticker", "exchange"]
          sort_by = "trade_date"
          max = 50
          level = "Warning"
        }
      ]
    }
    {
      name = "negative_value_check"
      engine = "custom"
      dataframes = ["default"]
      checks = [
        {
          constraint_name = "no_negatives"
          constraint = "WideTablesNegativeValuesCheck"
          ignore_columns = ["date", "source"]
          level = "Warning"
        }
      ]
    }
  ]
}
