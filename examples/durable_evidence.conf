# Durable evidence in a SQL database (ADR-006, SPEC-007)
#
# The database location is read from the environment and never written here:
#
#   export DQ_POSTGRES_DSN='postgresql+psycopg://user@host/quality'
#
# A URL written `postgresql://` means the psycopg 3 driver. Apply the reference
# DDL first -- `SqlAlchemyOutcomeSink(...).ddl_statements()` returns it -- and
# install the driver the URL names (`pip install "psycopg[binary]"`).
dqframework {
  repository {
    type = "postgres"
    dataset = "orders"
    dsn_env = "DQ_POSTGRES_DSN"       # the environment variable holding the URL
    schema = "dq"                     # where the evidence tables live
    namespace = "team_a"              # the tenant namespace stamped on every row
    retention_days = 30               # enables `sink.prune()`
    arrow = true                      # read Spark artifacts through pyarrow when installed
  }
  dataset = "orders_snapshot"
  dqrules = [
    {
      name = "portable_counts"
      engine = "portable"
      dataframes = ["default"]
      # Caller-certified snapshot digest: plans fingerprint data by
      # SHA-256 and the digest is never auto-derived.
      dataset = "orders"
      snapshot_sha256 = "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
      plan = [
        { constraint = "isComplete", constraint_name = "order_id_complete", column = "order_id", level = "Error" }
        { constraint = "hasSize", constraint_name = "orders_present", min = 1, level = "Warning" }
      ]
    }
  ]
}
