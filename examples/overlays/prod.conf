# Production overlay: include the shared pack, then override.
#
# An overlay is one entry file per environment. Two pyhocon behaviours
# decide whether it works:
#   1. Variables are NOT substituted inside `include` paths, so
#      `include "env/${ENV}.conf"` silently includes nothing. Use one
#      entry file per environment instead.
#   2. pyhocon reads one `key = value` per line inside `{ ... }`. Several
#      keys on one line is a parse error, so base.conf (like every rule
#      pack) writes each key on its own line.
#
# `${?VAR}` omits the key when the variable is unset -- the base value
# stands -- and substitutes it when the variable is set.
include "base.conf"

dqframework.dataset = "orders-prod"
# DQ_GATE_FAIL_ON unset -> "error" from base.conf; set -> that policy.
dqframework.gate.fail_on = ${?DQ_GATE_FAIL_ON}
