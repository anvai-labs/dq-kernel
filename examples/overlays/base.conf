# Shared rule pack for every environment (see prod.conf for an overlay).
dqframework {
  dataset = "orders"
  gate { fail_on = "error" }
  dqrules = [
    {
      name = "orders_quality"
      engine = "deequ"
      dataframes = ["default"]
      checks = [
        { constraint_name = "order_id_complete", constraint = "isComplete", column = "order_id", level = "Error" }
        { constraint_name = "amount_non_negative", constraint = "isNonNegative", column = "amount", level = "Warning" }
      ]
    }
  ]
}
