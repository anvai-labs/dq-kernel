# Multi-engine pipeline combining different validation engines
dqframework {
  dataframes {
    orders = "sales.orders"
    products = "inventory.products"
  }

  dqrules = [
    # Step 1: Schema validation
    {
      name = "orders_schema"
      engine = "schemavalidation"
      dataframes = ["orders"]
      schema {
        catalog_type = "spark"
        database = "sales"
        table = "orders"
        not_null_columns = ["order_id", "customer_id", "order_date"]
        unique_constraints = [["order_id"]]
      }
    }
    # Step 2: Deequ data quality checks
    {
      name = "orders_quality"
      engine = "deequ"
      dataframes = ["orders"]
      checks = [
        { constraint_name = "amount_positive", constraint = "isNonNegative", column = "amount", level = "Error" }
        { constraint_name = "status_valid", constraint = "isContainedIn", column = "status", allowed_values = ["pending", "shipped", "delivered", "cancelled"], level = "Error" }
      ]
    }
    # Step 3: Custom checks
    {
      name = "products_custom"
      engine = "custom"
      dataframes = ["products"]
      checks = [
        {
          constraint_name = "price_stability"
          constraint = "RateOfChange"
          columns = ["unit_price"]
          group_by = ["product_category"]
          sort_by = "effective_date"
          max = 25
          level = "Warning"
        }
      ]
    }
  ]

  # Optional: persist results
  repository {
    path = "/data/dq_metrics"
    format = "delta"
    dataset = "sales_pipeline"
  }
}
