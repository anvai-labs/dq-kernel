# pandera validation example (SPEC-017).
#
# `schema` is the document pandera's DataFrameSchema.to_json() writes, so a
# schema already in use travels into a rule pack unchanged. This one is for a
# pandas frame: schema_type = "dataframe". For a Polars frame write
# "polars_dataframe", Polars dtype names (Int64, Float64, String), and a
# check's argument as `value` where pandas writes `min_value` and `max_value`.
#
# A column admits no null and must be present unless the document says
# otherwise (`nullable = true`, `required = false`). A check marked
# `raise_warning = true` is reported with criticality "warn", so a gate set to
# fail_on = "error" does not block on it.
dqframework {
  dqrules = [
    {
      name = "orders_contract"
      engine = "pandera"
      dataframes = ["orders"]
      schema {
        schema_type = "dataframe"
        api = "pandas"
        name = "orders"
        columns {
          id {
            dtype = "int64"
            unique = true
          }
          amount {
            dtype = "float64"
            greater_than_or_equal_to = { min_value = 0, error = "amount is negative" }
            less_than_or_equal_to = { max_value = 1000, raise_warning = true }
          }
          note {
            dtype = "str"
            nullable = true
          }
        }
      }
    }
  ]
}
