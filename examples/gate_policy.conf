# Gate policy and notifiers: which failed checks stop a pipeline (ADR-013).
dqframework {
  # "any" (default): every failed check blocks, as it always has.
  # "error": checks whose criticality is "warn" are reported but do not block.
  # "never": report failures, never fail the gate.
  gate { fail_on = "error" }

  dataset = "orders"

  # One gate event is announced per run, after the run scope has committed.
  # HTTP notifiers retry three times with backoff and are fail-open.
  notifiers = [
    { type = "logging" }
    # Un-comment and set the environment variable to enable delivery:
    # { type = "webhook", url_env = "DQ_GATE_URL" }
    # { type = "slack",  url_env = "SLACK_WEBHOOK_URL" }
    # { type = "teams",  url_env = "TEAMS_WEBHOOK_URL" }
  ]

  dqrules = [
    {
      name = "orders_quality"
      engine = "deequ"
      dataframes = ["default"]
      checks = [
        # An Error-level failure blocks under every policy but "never".
        { constraint_name = "order_id_complete", constraint = "isComplete", column = "order_id", level = "Error" }
        # A Warning-level failure is advisory under fail_on = "error".
        { constraint_name = "amount_non_negative", constraint = "isNonNegative", column = "amount", level = "Warning" }
      ]
    }
  ]
}
